<body style="margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

    <div style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; z-index: 10;">
        
        <div id="clock-container" style="position: relative; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 15px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.5); overflow: hidden;">
            
            <canvas id="ripple-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" width="248" height="126"></canvas>

            <div style="position: relative; z-index: 2; text-align: center;">
                <div id="digital-clock" style="font-size: 3rem; font-weight: bold; color: #FFF; text-shadow: 0 0 15px rgba(255,255,255,0.6); letter-spacing: 2px;">19:08:01</div>
                <div class="hdm-text" style="font-size: 0.8rem; color: #DDD; text-transform: uppercase; margin-top: 5px; letter-spacing: 4px;">Madrid</div>
            </div>
        </div>

        <div id="welcome-box" style="margin-top: 20px; height: 40px; position: relative; width: 300px; display: flex; justify-content: center;">
            <style>
                .word { position: absolute; opacity: 0; transition: all 0.5s ease; font-size: 1.8rem; font-weight: bold; color: #FFF; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); white-space: nowrap; }
                .letter { display: inline-block; transition: all 0.4s ease; }
                .letter.out { transform: translateY(-20px) scale(0.5); opacity: 0; }
                .letter.behind { transform: translateY(20px); opacity: 0; }
                .letter.in { transform: translateY(0) scale(1); opacity: 1; }
            </style>
            <div class="word" style="opacity: 1;"><span class="letter in">B</span><span class="letter in">I</span><span class="letter in">E</span><span class="letter in">N</span><span class="letter in">V</span><span class="letter in">E</span><span class="letter in">N</span><span class="letter in">I</span><span class="letter in">D</span><span class="letter in">O</span><span class="letter in">S</span></div>
            <div class="word" style="opacity: 0;"><span class="letter out">V</span><span class="letter out">O</span><span class="letter out">U</span><span class="letter out">Q</span><span class="letter out">U</span><span class="letter out">E</span><span class="letter out">T</span><span class="letter out">-</span><span class="letter out">R</span><span class="letter out">A</span><span class="letter out">D</span><span class="letter out">I</span><span class="letter out">O</span></div>
        </div>

    <script>
        // 1. LÓGICA DEL RELOJ Y UBICACIÓN
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('digital-clock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        function setLocation() {
            try {
                const userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                // Limpiamos el formato (ej: "America/Mexico_City" -> "Mexico City")
                const city = userTimeZone.split('/')[1].replace(/_/g, ' '); 
                document.querySelector('.hdm-text').textContent = city || "Local Time";
            } catch (e) {
                document.querySelector('.hdm-text').textContent = "My City";
            }
        }

        setInterval(updateClock, 1000);
        updateClock();
        setLocation();

        // 2. EFECTO RIPPLES NATIVO
        const canvas = document.getElementById('ripple-canvas');
        const ctx = canvas.getContext('2d');
        let ripples = [];

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Ripple {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.r = 0;
                this.opacity = 0.5;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                this.r += 0.6;
                this.opacity -= 0.008;
            }
        }

        function animateRipples() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (Math.random() < 0.03) ripples.push(new Ripple());
            ripples.forEach((r, i) => {
                r.draw();
                if (r.opacity <= 0) ripples.splice(i, 1);
            });
            requestAnimationFrame(animateRipples);
        }
        animateRipples();

        // 3. ANIMACIÓN DE TEXTO
        const words = document.querySelectorAll('.word');
        let currentWordIndex = 0;

        function setupWords() {
            words.forEach(word => {
                const text = word.textContent;
                word.innerHTML = '';
                [...text].forEach(char => {
                    const span = document.createElement('span');
                    span.className = 'letter behind';
                    span.innerHTML = char === ' ' ? '&nbsp;' : char;
                    word.appendChild(span);
                });
            });
        }

        function changeWord() {
            const currentWord = words[currentWordIndex];
            const nextIndex = (currentWordIndex + 1) % words.length;
            const nextWord = words[nextIndex];

            const currentLetters = currentWord.querySelectorAll('.letter');
            currentLetters.forEach((l, i) => {
                setTimeout(() => l.className = 'letter out', i * 50);
            });
            setTimeout(() => { currentWord.style.opacity = 0; }, currentLetters.length * 50 + 400);

            nextWord.style.opacity = 1;
            const nextLetters = nextWord.querySelectorAll('.letter');
            nextLetters.forEach((l, i) => {
                l.className = 'letter behind';
                setTimeout(() => l.className = 'letter in', 600 + (i * 50));
            });

            currentWordIndex = nextIndex;
        }

        setupWords();
        words[0].style.opacity = 1;
        words[0].querySelectorAll('.letter').forEach(l => l.className = 'letter in');
        setInterval(changeWord, 4000);
    </script>

                var p = items[i].querySelector(".rule-content p");
                if (h) h.textContent = data.items[i].h;
                if (p) p.textContent = data.items[i].p;
            }
            var btns = document.querySelectorAll(".rules-lang .lang-btn");
            for (var j = 0; j < btns.length; j++) {
                btns[j].classList.toggle("active", btns[j].getAttribute("data-lang") === lang);
            }
        }
        window.applyRulesLang = applyRulesLang;

        var langBtns = document.querySelectorAll(".rules-lang .lang-btn");
        for (var k = 0; k < langBtns.length; k++) {
            langBtns[k].addEventListener("click", function () {
                applyRulesLang(this.getAttribute("data-lang") || "en");
            });
        }
        applyRulesLang("en");

        /* ── Stars ───────────────────────────────── */
        var starsEl = document.getElementById("stars");
        for (var i = 0; i < 180; i++) {
            var s = document.createElement("div");
            s.className = "star";
            var size = Math.random() < 0.6 ? 1 : (Math.random() < 0.75 ? 1.5 : 2.5);
            s.style.width = size + "px"; s.style.height = size + "px";
            s.style.top = (Math.random() * 80) + "%"; s.style.left = (Math.random() * 100) + "%";
            var baseOp = 0.2 + Math.random() * 0.3;
            s.style.setProperty("--base-opacity", baseOp);
            s.style.setProperty("--peak-opacity", Math.min(baseOp + 0.5 + Math.random() * 0.3, 1));
            if (Math.random() < 0.6) {
                var speed = Math.random() < 0.33 ? "2.5s" : (Math.random() < 0.5 ? "1.8s" : "4s");
                s.style.animation = `twinkle ${speed} ease-in-out infinite`;
                s.style.animationDelay = (Math.random() * 6) + "s";
            } else {
                s.style.opacity = baseOp;
            }
            if (size >= 2) s.style.boxShadow = "0 0 " + (2 + Math.random() * 3) + "px rgba(180, 190, 255, 0.5)";
            starsEl.appendChild(s);
        }

        /* ── Shooting stars & Lightning ── */
        var isWidescreen = window.matchMedia("(min-aspect-ratio: 16/10)").matches;
        var isSplit = window.matchMedia("(min-aspect-ratio: 3/4) and (max-aspect-ratio: 10/9)").matches;

        if (isWidescreen || isSplit) {
            var shootEl = document.getElementById("shootingStars");
            function spawnShootingStar() {
                if (!shootEl) return;
                var el = document.createElement("div"); el.className = "shooting-star";
                el.style.top = (3 + Math.random() * 55) + "%"; el.style.left = (5 + Math.random() * 85) + "%";
                var angle = 25 + Math.random() * 30;
                el.style.setProperty("--angle", angle + "deg"); el.style.transform = "rotate(" + angle + "deg)";
                el.style.width = (60 + Math.random() * 60) + "px"; shootEl.appendChild(el);
                setTimeout(function () { el.remove(); }, 1500);
            }

            var lightCont = document.getElementById("lightningContainer");
            var flashEl = document.getElementById("flashOverlay");
            var svgNS = "http://www.w3.org/2000/svg";
            function generateBoltPoints(startX, startY, endY) {
                var points = startX + "," + startY; var y = startY; var x = startX;
                while (y < endY) { y += 15 + Math.random() * 40; x += (Math.random() - 0.5) * 80; points += " " + x + "," + y; }
                return points;
            }
            function spawnLightning() {
                if (!lightCont || !flashEl) return;
                var svg = document.createElementNS(svgNS, "svg");
                svg.setAttribute("width", "100%"); svg.setAttribute("height", "100%");
                svg.style.cssText = "position:absolute; top:0; left:0; filter:drop-shadow(0 0 6px rgba(150,180,255,0.9)) drop-shadow(0 0 15px rgba(100,140,255,0.5)); opacity:0;";
                var bolt = document.createElementNS(svgNS, "polyline");
                var startX = window.innerWidth * (0.1 + Math.random() * 0.8);
                var endY = window.innerHeight * (0.4 + Math.random() * 0.4);
                bolt.setAttribute("points", generateBoltPoints(startX, 0, endY));
                bolt.setAttribute("fill", "none"); bolt.setAttribute("stroke", "rgba(210, 220, 255, 0.9)");
                bolt.setAttribute("stroke-width", "1.5"); bolt.setAttribute("stroke-linecap", "round"); bolt.setAttribute("stroke-linejoin", "round");
                svg.appendChild(bolt); lightCont.appendChild(svg);
                flashEl.style.opacity = "1";
                setTimeout(function() { flashEl.style.opacity = "0.2"; }, 60);
                setTimeout(function() { flashEl.style.opacity = "0.8"; }, 120);
                setTimeout(function() { flashEl.style.opacity = "0"; }, 250);
                svg.animate([
                    { opacity: 0 }, { opacity: 1, offset: 0.1 }, { opacity: 0.2, offset: 0.2 }, { opacity: 0.9, offset: 0.3 }, { opacity: 0 }
                ], { duration: 500, easing: "ease-out" }).onfinish = function() { svg.remove(); };
            }

            if (eco) {
                function ecoBurst() {
                    if (document.hidden) return;
                    document.documentElement.classList.add("fx-active");
                    spawnShootingStar();
                    if (Math.random() < 0.18) spawnLightning();
                    setTimeout(function () { document.documentElement.classList.remove("fx-active"); }, 1200);
                }
                function scheduleEcoBurst() {
                    var delay = 6500 + Math.random() * 9000;
                    setTimeout(function () { ecoBurst(); scheduleEcoBurst(); }, delay);
                }
                setTimeout(function () { ecoBurst(); scheduleEcoBurst(); }, 1200);
            } else {
                function scheduleShoot() {
                    var delay = 3000 + Math.random() * 5000;
                    setTimeout(function () { spawnShootingStar(); scheduleShoot(); }, delay);
                }
                setTimeout(function () { spawnShootingStar(); scheduleShoot(); }, 1500 + Math.random() * 1500);
                setTimeout(function () {
                    function scheduleShoot2() {
                        var delay = 4000 + Math.random() * 7000;
                        setTimeout(function () { spawnShootingStar(); scheduleShoot2(); }, delay);
                    }
                    spawnShootingStar(); scheduleShoot2();
                }, 3000 + Math.random() * 2000);

                function scheduleLightning() {
                    var delay = 8000 + Math.random() * 15000;
                    setTimeout(function() { spawnLightning(); scheduleLightning(); }, delay);
                }
                setTimeout(function() { spawnLightning(); scheduleLightning(); }, 6000 + Math.random() * 2000);
            }
        }

        /* ── Pause when tab hidden ────────────────── */
        var sceneEl = document.querySelector(".scene");
        document.addEventListener("visibilitychange", function () {
            sceneEl.classList.toggle("paused", document.hidden);
        });
    </script>
	<script>
function keepLogoBelowMoon() {
    const moon = document.querySelector('.moon-container');
    const logo = document.querySelector('.logo-area');

    if (!moon || !logo) return;

    // Păstrăm poziția originală
    logo.style.transform = 'translateY(-50%)';

    const moonRect = moon.getBoundingClientRect();
    const logoRect = logo.getBoundingClientRect();

    // Spațiul dintre lună și text
    const gap = 20;

    // Dacă logo-ul intră peste lună, îl coborâm doar cât trebuie
    if (logoRect.top < moonRect.bottom + gap) {
        const moveDown = moonRect.bottom + gap - logoRect.top;

        logo.style.transform =
            `translateY(calc(-50% + ${moveDown}px))`;
    }
}

window.addEventListener('load', keepLogoBelowMoon);
window.addEventListener('resize', keepLogoBelowMoon);

if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', keepLogoBelowMoon);
}
</script>
